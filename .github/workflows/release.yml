name: Release

# The release button: builds and tests both supported platforms from the
# current master, then publishes the next numeric tag after all four jobs have
# succeeded.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: release tag (empty picks the next number)
        required: false

permissions:
  attestations: write
  contents: write
  id-token: write

jobs:
  build-linux:
    name: Build Linux artifacts
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check out IX
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: pg83/ix
          ref: 487d974011527cf9face187dc2214c271377b508
          path: .ix

      - name: Install system build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            autopoint binutils bison bzip2 ca-certificates clang cmake curl file flex gettext \
            git glslang-tools gperf gzip libclang-rt-dev librsvg2-bin \
            lld llvm m4 make meson ninja-build perl pkg-config python3 ragel rsync xz-utils

      - name: Enable unprivileged user namespaces
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0

      - name: Build Linux binaries through IX
        env:
          IX_FLAGS: all_system=1,intl_ver=no,system_aclocal_path=/usr/share/aclocal
          IX_ROOT: ${{ runner.temp }}/ix
          IX_THREADS: 4
        run: |
          set -o pipefail
          mkdir -p "$RUNNER_TEMP/linux-build-diagnostics"
          .ix/ix run \
            --target=x86_64-linux \
            --libdlfcn_ver=elf \
            bld/compiler \
            bin/clang/env \
            lib/c \
            lib/c++ \
            lib/freetype \
            lib/fontconfig \
            lib/harfbuzz \
            lib/brotli \
            lib/simd/utf \
            lib/linux/headers \
            lib/wayland \
            lib/wayland/dl \
            lib/xkb/common \
            lib/vulkan/loader \
            lib/vulkan/headers \
            bld/wayland \
            bin/ragel/6 \
            bin/glslang \
            -- \
            dev/build_release_linux.sh \
              "$RUNNER_TEMP/build-linux" \
              "$RUNNER_TEMP/linux-build-diagnostics" \
            2>&1 \
            | tee "$RUNNER_TEMP/linux-build-diagnostics/build.log" \
            | python3 dev/prefix_timestamps.py

      - name: Upload Linux build diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-build-diagnostics
          path: ${{ runner.temp }}/linux-build-diagnostics/*
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      - name: Stage Linux binaries
        run: |
          mkdir -p "$RUNNER_TEMP/linux-x86_64"
          for binary in st pt; do
            cp -L "$RUNNER_TEMP/build-linux/$binary" "$RUNNER_TEMP/linux-x86_64/$binary"
          done

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/linux-x86_64/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test-linux-alpine:
    name: Test Linux artifact on Alpine
    needs: build-linux
    runs-on: ubuntu-26.04
    container: alpine:3.24
    timeout-minutes: 15
    steps:
      - name: Install release test dependencies
        run: |
          apk add --no-cache \
            binutils coreutils file gcompat git mesa-vulkan-swrast \
            weston weston-backend-x11 xvfb

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/linux-x86_64

      - name: Test Linux artifact
        run: sh dev/test_release_linux.sh "$RUNNER_TEMP/linux-x86_64" "$RUNNER_TEMP"

      - name: Upload Linux release test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-test-logs-alpine
          path: |
            ${{ runner.temp }}/dlfcn.log
            ${{ runner.temp }}/vulkan-wayland.log
            ${{ runner.temp }}/weston.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  test-linux-fedora:
    name: Test Linux artifact on Fedora
    needs: build-linux
    runs-on: ubuntu-26.04
    container: fedora:44
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/linux-x86_64

      - name: Install release test dependencies
        run: |
          dnf -y --setopt=install_weak_deps=False \
            --setopt=retries=10 --setopt=timeout=60 --setopt=zchunk=False \
            install \
            binutils coreutils file mesa-vulkan-drivers weston xorg-x11-server-Xvfb

      - name: Test Linux artifact
        run: sh dev/test_release_linux.sh "$RUNNER_TEMP/linux-x86_64" "$RUNNER_TEMP"

      - name: Upload Linux release test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-test-logs-fedora
          path: |
            ${{ runner.temp }}/dlfcn.log
            ${{ runner.temp }}/vulkan-wayland.log
            ${{ runner.temp }}/weston.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  test-linux-ubuntu:
    name: Test Linux artifact on Ubuntu
    needs: build-linux
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/linux-x86_64

      - name: Install release test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            binutils coreutils file mesa-vulkan-drivers weston xvfb

      - name: Test Linux artifact
        run: sh dev/test_release_linux.sh "$RUNNER_TEMP/linux-x86_64" "$RUNNER_TEMP"

      - name: Upload Linux release test logs
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: linux-release-test-logs-ubuntu
          path: |
            ${{ runner.temp }}/dlfcn.log
            ${{ runner.temp }}/vulkan-wayland.log
            ${{ runner.temp }}/weston.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  build-darwin:
    name: Build Darwin artifacts
    runs-on: macos-14
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the toolchain
        run: |
          brew install llvm ragel glslang spirv-cross librsvg
          command -v pkg-config >/dev/null || brew install pkgconf

      - name: Build Darwin binaries
        run: dev/build_brew_macos.sh

      - name: Stage Darwin binaries
        run: |
          mkdir -p "$RUNNER_TEMP/darwin-arm64"
          cp -L .build-darwin/st .build-darwin/pt "$RUNNER_TEMP/darwin-arm64/"

      - name: Upload Darwin artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: darwin-arm64
          path: ${{ runner.temp }}/darwin-arm64/*
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test-darwin:
    name: Test Darwin artifacts
    needs: build-darwin
    runs-on: macos-14
    timeout-minutes: 15
    steps:
      - name: Download Darwin artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-arm64
          path: ${{ runner.temp }}/darwin-arm64

      - name: Verify Darwin binaries
        run: |
          chmod +x "$RUNNER_TEMP/darwin-arm64/st" "$RUNNER_TEMP/darwin-arm64/pt"
          prefix="$(brew --prefix)"
          for binary in st pt; do
            path="$RUNNER_TEMP/darwin-arm64/$binary"
            file "$path"
            file "$path" | grep -q 'Mach-O 64-bit executable arm64'
            if otool -L "$path" | grep -Fq "$prefix"; then
              echo "release binary links Homebrew dylibs: $binary" >&2
              otool -L "$path" >&2
              exit 1
            fi
          done
          "$RUNNER_TEMP/darwin-arm64/st" -version | grep -q '^Shitty '
          "$RUNNER_TEMP/darwin-arm64/pt" -version | grep -q '^Pretty '

      - name: Test Metal through Cocoa
        run: |
          python3 - "$RUNNER_TEMP/darwin-arm64/st" <<'PY'
          import subprocess
          import sys

          subprocess.run(
              [
                  sys.argv[1],
                  "-geometry", "20x5",
                  "-e", "/bin/sh", "-c",
                  'printf "Metal Cocoa smoke\\n"; sleep 2',
              ],
              check=True,
              timeout=30,
          )
          PY

  build-windows:
    name: Build Windows ZIP
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Windows cross-build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential clang lld llvm make python3 perl pkg-config \
            cmake ninja-build git curl unzip zip ragel glslang-tools librsvg2-bin \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix

      - name: Fetch pinned llvm-mingw, ConPTY and vcpkg
        run: |
          set -euo pipefail
          python3 dev/windows/fetch_toolchain.py \
            --lock dev/windows/toolchain.lock \
            --platform linux_x86_64 \
            --output "$RUNNER_TEMP/llvm-mingw"
          python3 dev/windows/fetch_toolchain.py \
            --lock dev/windows/toolchain.lock \
            --platform conpty_x86_64 \
            --output "$RUNNER_TEMP/conpty"
          commit="$(python3 -c 'import tomllib; print(tomllib.load(open("dev/windows/toolchain.lock", "rb"))["vcpkg_commit"])')"
          git init "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 https://github.com/microsoft/vcpkg.git "$commit"
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg" install \
            --triplet x64-mingw-dynamic \
            --x-manifest-root="$GITHUB_WORKSPACE/dev/windows" \
            --x-install-root="$RUNNER_TEMP/vcpkg-installed"

      - name: Build Windows applications
        run: |
          set -euo pipefail
          toolchain="$RUNNER_TEMP/llvm-mingw"
          installed="$RUNNER_TEMP/vcpkg-installed"
          export CC="$toolchain/bin/x86_64-w64-mingw32-clang"
          export CXX="$toolchain/bin/x86_64-w64-mingw32-clang++"
          export RC="$toolchain/bin/llvm-rc"
          export AR="$toolchain/bin/llvm-ar"
          export PKG_CONFIG_LIBDIR="$installed/x64-mingw-dynamic/lib/pkgconfig:$installed/x64-mingw-dynamic/share/pkgconfig"
          python3 build --target=x86_64-w64-windows-gnu \
            -B "$RUNNER_TEMP/windows-app" -j "$(nproc)" st pt

      - name: Assemble deterministic Windows ZIP
        run: |
          set -euo pipefail
          runtime="$RUNNER_TEMP/windows-runtime"
          installed="$RUNNER_TEMP/vcpkg-installed/x64-mingw-dynamic"
          toolchain="$RUNNER_TEMP/llvm-mingw"
          conpty="$RUNNER_TEMP/conpty"
          mkdir -p "$runtime/x64" "$RUNNER_TEMP/windows-release"
          cp -L "$RUNNER_TEMP/windows-app/st.exe" "$runtime/st.exe"
          cp -L "$RUNNER_TEMP/windows-app/pt.exe" "$runtime/pt.exe"
          cp "$installed/bin/"*.dll "$runtime/"
          cp "$toolchain/x86_64-w64-mingw32/bin/libc++.dll" "$runtime/"
          cp "$toolchain/x86_64-w64-mingw32/bin/libunwind.dll" "$runtime/"
          cp "$(x86_64-w64-mingw32-g++ -print-file-name=libgcc_s_seh-1.dll)" "$runtime/"
          cp "$(x86_64-w64-mingw32-g++ -print-file-name=libstdc++-6.dll)" "$runtime/"
          cp "$(x86_64-w64-mingw32-g++ -print-file-name=libwinpthread-1.dll)" "$runtime/"
          cp "$conpty/conpty.dll" "$runtime/"
          cp "$conpty/x64/OpenConsole.exe" "$runtime/x64/"
          export SOURCE_DATE_EPOCH="$(git show -s --format=%ct HEAD)"
          python3 dev/windows/package.py \
            --runtime-dir "$runtime" \
            --project-root "$GITHUB_WORKSPACE" \
            --vcpkg-share "$installed/share" \
            --llvm-license "$toolchain/LICENSE.TXT" \
            --gcc-copyright /usr/share/doc/g++-mingw-w64-x86-64/copyright \
            --objdump "$toolchain/bin/llvm-objdump" \
            --readobj "$toolchain/bin/llvm-readobj" \
            --output "$RUNNER_TEMP/windows-release/shitty-windows-x86_64.zip"

      - name: Upload Windows ZIP
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x86_64-release
          path: ${{ runner.temp }}/windows-release/shitty-windows-x86_64.zip
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

  test-windows:
    name: Test Windows ZIP proxy
    needs: build-windows
    runs-on: windows-2025
    timeout-minutes: 15
    steps:
      - name: Download Windows ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x86_64-release
          path: ${{ runner.temp }}/windows-release

      - name: Run clean-path package smoke
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP "windows-smoke"
          Expand-Archive \
            (Join-Path $env:RUNNER_TEMP "windows-release\shitty-windows-x86_64.zip") \
            $root
          $app = Join-Path $root "shitty-windows-x86_64"
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $version = Start-Process (Join-Path $app "st.exe") -ArgumentList @("-v") -WorkingDirectory $app -Wait -PassThru
          $st = Start-Process (Join-Path $app "st.exe") -ArgumentList @("-config", ".\config\shitty.toml", "-e", "cmd.exe", "/D", "/Q", "/C", '"exit /b 21"') -WorkingDirectory $app -Wait -PassThru
          $pt = Start-Process (Join-Path $app "pt.exe") -ArgumentList @("-config", ".\config\pretty.toml", "-e", "cmd.exe", "/D", "/Q", "/C", '"exit /b 22"') -WorkingDirectory $app -Wait -PassThru
          if ($version.ExitCode -ne 0 -or $st.ExitCode -ne 21 -or $pt.ExitCode -ne 22) {
            throw "Windows package proxy exits version=$($version.ExitCode) st=$($st.ExitCode) pt=$($pt.ExitCode)"
          }

  package-release:
    name: Package and publish release
    needs:
      - build-linux
      - test-linux-alpine
      - test-linux-fedora
      - test-linux-ubuntu
      - build-darwin
      - test-darwin
      - build-windows
      - test-windows
    runs-on: ubuntu-26.04
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Download Linux artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: linux-x86_64
          path: ${{ runner.temp }}/release-input/linux-x86_64

      - name: Download Darwin artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: darwin-arm64
          path: ${{ runner.temp }}/release-input/darwin-arm64

      - name: Download Windows ZIP
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x86_64-release
          path: ${{ runner.temp }}/release-input/windows-x86_64

      - name: Let the release push tags
        run: |
          git config --global user.name "shitty release bot"
          git config --global user.email "noreply@github.com"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Create draft release
        run: |
          python3 dev/release.py ${{ inputs.tag }} --sha "$GITHUB_SHA" --generate-notes \
            --artifacts-directory "$RUNNER_TEMP/release-artifacts" --draft \
            --tag-file "$RUNNER_TEMP/release-tag" \
            --linux-binaries-directory "$RUNNER_TEMP/release-input/linux-x86_64" \
            --darwin-binaries-directory "$RUNNER_TEMP/release-input/darwin-arm64" \
            --extra-artifact "$RUNNER_TEMP/release-input/windows-x86_64/shitty-windows-x86_64.zip"
        env:
          GH_TOKEN: ${{ github.token }}

      - name: Attest release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            ${{ runner.temp }}/release-artifacts/*.tar.gz
            ${{ runner.temp }}/release-input/windows-x86_64/*.zip

      - name: Publish release
        run: gh release edit "$(cat "$RUNNER_TEMP/release-tag")" --draft=false --repo "$GITHUB_REPOSITORY"
        env:
          GH_TOKEN: ${{ github.token }}
