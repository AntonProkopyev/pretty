name: CI

on:
  pull_request:
  push:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Linux
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31.11.1
        with:
          enable_kvm: false

      - name: Build package
        run: |
          set -o pipefail
          nix build -L --no-link \
            .#checks.x86_64-linux.build \
            2>&1 | tee "$RUNNER_TEMP/build.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/build.log" \
            --title "Build Linux" \
            --reproduce "nix build -L --no-link .#checks.x86_64-linux.build"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: build-log
          path: ${{ runner.temp }}/build.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  windows-toolchain:
    name: Windows toolchain proxy
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.14"

      - name: Run Windows-safe build runner tests
        shell: pwsh
        run: |
          python -m unittest `
            tst.test_build_metadata.BuildMetadataTests.test_windows_native_target_uses_mingw_triple `
            tst.test_build_metadata.BuildMetadataTests.test_windows_programs_have_exe_suffix `
            tst.test_build_metadata.BuildMetadataTests.test_windows_resources_use_llvm_rc `
            tst.test_build_metadata.BuildMetadataTests.test_windows_supervisor_runs_main_without_posix_process_group `
            tst.test_build_metadata.BuildMetadataTests.test_windows_build_runner_uses_native_file_lock `
            tst.test_build_metadata.BuildMetadataTests.test_cache_store_copies_when_hard_links_are_unavailable `
            tst.test_build_metadata.BuildMetadataTests.test_cache_restore_copies_when_links_are_unavailable `
            tst.test_build_metadata.BuildMetadataTests.test_publish_refreshes_managed_copy_without_symlink_privilege `
            tst.test_build_metadata.BuildMetadataTests.test_cxx_standard_probe_uses_target_compiler `
            tst.test_windows_toolchain

      - name: Fetch pinned llvm-mingw
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:RUNNER_TEMP "llvm-mingw"
          python dev/windows/fetch_toolchain.py `
            --lock dev/windows/toolchain.lock `
            --platform windows_x86_64 `
            --output $toolchain

      - name: Compile, inspect, and run PE probe
        shell: pwsh
        run: |
          $toolchain = Join-Path $env:RUNNER_TEMP "llvm-mingw"
          $probe = Join-Path $env:RUNNER_TEMP "probe.exe"
          python dev/windows/probe_toolchain.py `
            --toolchain $toolchain `
            --output $probe
          & $probe
          if ($LASTEXITCODE -ne 0) {
            throw "PE probe exited with $LASTEXITCODE"
          }

  windows-cross:
    name: Build Windows x64
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cross-build and software Vulkan tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential clang lld llvm make python3 perl pkg-config \
            cmake ninja-build git curl unzip zip ragel glslang-tools librsvg2-bin \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix \
            wine xvfb xauth mesa-vulkan-drivers libvulkan1

      - name: Fetch pinned llvm-mingw and vcpkg
        shell: bash
        run: |
          set -euo pipefail
          python3 dev/windows/fetch_toolchain.py \
            --lock dev/windows/toolchain.lock \
            --platform linux_x86_64 \
            --output "$RUNNER_TEMP/llvm-mingw"
          commit="$(python3 -c 'import tomllib; print(tomllib.load(open("dev/windows/toolchain.lock", "rb"))["vcpkg_commit"])')"
          git init "$RUNNER_TEMP/vcpkg"
          git -C "$RUNNER_TEMP/vcpkg" fetch --depth 1 https://github.com/microsoft/vcpkg.git "$commit"
          git -C "$RUNNER_TEMP/vcpkg" checkout --detach FETCH_HEAD
          "$RUNNER_TEMP/vcpkg/bootstrap-vcpkg.sh" -disableMetrics
          "$RUNNER_TEMP/vcpkg/vcpkg" install \
            --triplet x64-mingw-dynamic \
            --x-manifest-root="$GITHUB_WORKSPACE/dev/windows" \
            --x-install-root="$RUNNER_TEMP/vcpkg-installed"

      - name: Build Windows-safe graph and applications
        shell: bash
        run: |
          set -euo pipefail
          toolchain="$RUNNER_TEMP/llvm-mingw"
          installed="$RUNNER_TEMP/vcpkg-installed"
          export CC="$toolchain/bin/x86_64-w64-mingw32-clang"
          export CXX="$toolchain/bin/x86_64-w64-mingw32-clang++"
          export RC="$toolchain/bin/llvm-rc"
          export AR="$toolchain/bin/llvm-ar"
          export VCPKG_INSTALLED="$installed"
          export PKG_CONFIG_LIBDIR="$installed/x64-mingw-dynamic/lib/pkgconfig:$installed/x64-mingw-dynamic/share/pkgconfig"
          python3 build --build-file windows_build.py \
            --target=x86_64-w64-windows-gnu \
            -B "$RUNNER_TEMP/windows-tests" -j "$(nproc)" windows-test
          python3 build --target=x86_64-w64-windows-gnu \
            -B "$RUNNER_TEMP/windows-app" -j "$(nproc)" st pt

      - name: Run software Vulkan proxy
        shell: bash
        run: |
          set -euo pipefail
          export WINEDEBUG=-all
          export VK_ICD_FILENAMES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          timeout 60 xvfb-run -a wine "$RUNNER_TEMP/windows-tests/windows_vulkan_test.exe"

      - name: Assemble and audit Windows artifact
        shell: bash
        run: |
          set -euo pipefail
          package="$RUNNER_TEMP/windows-package"
          installed="$RUNNER_TEMP/vcpkg-installed/x64-mingw-dynamic"
          toolchain="$RUNNER_TEMP/llvm-mingw"
          mkdir -p "$package"
          cp -L "$RUNNER_TEMP/windows-app/st.exe" "$package/st.exe"
          cp -L "$RUNNER_TEMP/windows-app/pt.exe" "$package/pt.exe"
          for name in windows_headless_test windows_win32_test windows_vulkan_test windows_font_test windows_conpty_test; do
            cp -L "$RUNNER_TEMP/windows-tests/$name.exe" "$package/$name.exe"
          done
          cp "$installed/bin/"*.dll "$package/"
          cp "$toolchain/x86_64-w64-mingw32/bin/libc++.dll" "$package/"
          cp "$toolchain/x86_64-w64-mingw32/bin/libunwind.dll" "$package/"
          cp "$(x86_64-w64-mingw32-g++ -print-file-name=libgcc_s_seh-1.dll)" "$package/"
          cp "$(x86_64-w64-mingw32-g++ -print-file-name=libstdc++-6.dll)" "$package/"
          cp "$(x86_64-w64-mingw32-g++ -print-file-name=libwinpthread-1.dll)" "$package/"
          python3 dev/windows/audit_pe.py \
            --objdump "$toolchain/bin/llvm-objdump" \
            --root "$package" st.exe pt.exe \
            > "$package/pe-audit.json"

      - name: Upload Windows artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: windows-x64
          path: ${{ runner.temp }}/windows-package
          if-no-files-found: error
          retention-days: 7
          compression-level: 9

  windows-runtime:
    name: Windows Server 2025 proxy evidence
    needs: windows-cross
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Download Windows artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: windows-x64
          path: ${{ runner.temp }}/windows-package

      - name: Run Windows-safe tests three times
        shell: pwsh
        working-directory: ${{ runner.temp }}/windows-package
        run: |
          $ErrorActionPreference = "Stop"
          foreach ($attempt in 1..3) {
            & .\windows_headless_test.exe
            if ($LASTEXITCODE -ne 0) { throw "headless attempt $attempt exited $LASTEXITCODE" }
            & .\windows_win32_test.exe
            if ($LASTEXITCODE -ne 0) { throw "Win32 attempt $attempt exited $LASTEXITCODE" }
            & .\windows_font_test.exe
            if ($LASTEXITCODE -ne 0) { throw "font attempt $attempt exited $LASTEXITCODE" }
            $receipt = Join-Path $env:RUNNER_TEMP "conpty-$attempt.txt"
            $env:SHITTY_CONPTY_RECEIPT = $receipt
            $conpty = Start-Process .\windows_conpty_test.exe -Wait -PassThru
            if ($conpty.ExitCode -ne 0) { throw "ConPTY attempt $attempt exited $($conpty.ExitCode)" }
            Get-Content $receipt
          }

  tests-alpine:
    name: Tests Alpine
    needs: build
    runs-on: ubuntu-24.04
    container: alpine:3.24
    timeout-minutes: 90
    steps:
      - name: Prepare Alpine for GitHub Actions
        run: apk add --no-cache gcompat git

      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the stock Alpine toolchain
        run: |
          apk add --no-cache \
            bash gcc g++ musl-dev linux-headers make python3 zstd perl perl-doc pkgconf \
            diffutils procps ragel glslang rsvg-convert ncurses-dev \
            brotli-dev fontconfig-dev freetype-dev harfbuzz-dev simdutf-dev \
            libxkbcommon-dev wayland-dev wayland-protocols \
            vulkan-headers vulkan-loader-dev mesa-vulkan-swrast

      - name: Run full test suite with GCC and musl
        env:
          CC: gcc
          CXX: g++
          SHITTY_TEST_VULKAN_REQUIRED: "1"
        run: |
          set -o pipefail
          export VK_DRIVER_FILES="$(find /usr/share/vulkan/icd.d -name 'lvp_icd*.json' -print -quit)"
          export VK_ICD_FILENAMES="$VK_DRIVER_FILES"
          ./build test a so tgz 2>&1 | tee "$RUNNER_TEMP/tests-alpine.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-alpine.log" \
            --title "Tests Alpine" \
            --reproduce "run the Tests Alpine steps from .github/workflows/ci.yml in an alpine:3.24 container"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-alpine-log
          path: ${{ runner.temp }}/tests-alpine.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

  tests-fedora:
    name: Tests Fedora
    needs: build
    runs-on: ubuntu-24.04
    container: fedora:44
    timeout-minutes: 90
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install the stock Fedora toolchain
        # Retry: the Fedora mirrors intermittently fail mid-download (curl 23,
        # "Failed writing received data to disk", usually on a zchunk delta), so
        # disable zchunk, prefer the fastest mirror, and try a few times.
        run: |
          for attempt in 1 2 3 4 5; do
            if dnf -y --setopt=install_weak_deps=False \
                --setopt=retries=10 --setopt=timeout=60 \
                --setopt=fastestmirror=True --setopt=zchunk=False \
                install \
                gcc-c++ make git python3 perl pkgconf-pkg-config diffutils procps-ng \
                ragel glslang librsvg2-tools ncurses-devel \
                freetype-devel fontconfig-devel harfbuzz-devel \
                libxkbcommon-devel \
                vulkan-headers vulkan-loader-devel mesa-vulkan-drivers \
                wayland-devel wayland-protocols-devel; then
              exit 0
            fi
            echo "dnf install failed (attempt $attempt); cleaning and retrying" >&2
            dnf clean all || true
            sleep 15
          done
          echo "dnf install failed after 5 attempts" >&2
          exit 1

      - name: Run full test suite with GCC and Ragel 7
        env:
          CC: gcc
          CXX: g++
        run: |
          set -o pipefail
          ./build test a so tgz 2>&1 | tee "$RUNNER_TEMP/tests-fedora.log"

      - name: Summarize failure
        if: failure()
        run: |
          python3 dev/ci_report.py \
            --log "$RUNNER_TEMP/tests-fedora.log" \
            --title "Tests Fedora" \
            --reproduce "run the Tests Fedora steps from .github/workflows/ci.yml in a fedora:44 container"

      - name: Upload failure log
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: tests-fedora-log
          path: ${{ runner.temp }}/tests-fedora.log
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 9

